<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape from Dema</title>
    <link rel="stylesheet" href="../css/play.css">
    <link href="https://cdnfonts.com" rel="stylesheet">
</head>

<body>

    <img id="imagemFundo" src="../assets/background.png">

    <div id="interface">
        <div id="telaTitulo">
            <span class="logo"> <img style="width: 1315px; height: 726px;" src="../assets/logo.png" alt=""></span>
            <button class="btn-centro" onclick="cenaIntro1()">PLAY</button>
            <button class="btn-centro" onclick="window.location.href='./dashboard/dashboard.html'"
                style="margin-top: 20px; font-size: 25px;">ESTATÍSTICAS</button>
        </div>

        <div id="telaJogo" hidden>
            <button id="btnPular" onclick="pularParaEscolhas()">Pular para as escolhas</button>
            <div id="nome"></div>
            <div id="texto"></div>
            <div id="botoes"></div>
        </div>
    </div>

</body>

</html>

<script>

    let etapaEscolha = 1;

    function pularParaEscolhas() {
        if (etapaEscolha == 1) {
            cenaIntro8();
        } else if (etapaEscolha == 2) {
            cenaTorre();
        } else if (etapaEscolha == 3) {
            cenaPatio3();
        } else if (etapaEscolha == 4) {
            cenaDecisaoFinal();
        }
    }

    function cenaIntro1() {
        telaTitulo.hidden = true
        telaJogo.hidden = false
        imagemFundo.src = '../assets/Quarto.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'Lá fora, o brilho artificial da cidade está mais forte do que nunca, hoje é a Assembleia Anual dos Glorificados, a grande cerimônia onde os cidadãos de Dema se entregam ao Vialismo, uma religião que preza pela desistência de si mesmo, que seus devotos se tornem uma casca vazia, mas você não estava pronto, na verdade, você se recusou a se entregar.'
        botoes.innerHTML = '<button onclick="cenaIntro2()">Continuar</button>'

        let usuario = sessionStorage.getItem('ID_USUARIO')

        fetch("/questionario/deletarQuestoes", {
            method: "DELETE",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                idUsuario: usuario
            })
        })
            .then(function (resposta) {
                return resposta.json()
            })
            .then(function (dados) {
                console.log(dados.mensagem)
            })
            .catch(function (erro) {
                console.log(erro)
            })
    }

    function cenaIntro2() {
        imagemFundo.src = '../assets/Quarto.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'Os líderes do Vialismo os Bispos, viram a sua força de vontade, viram que a faísca na sua mente ainda não tinha se apagado, e por isso, você virou um alvo, eles sabem que uma mente que questiona o próprio sofrimento é perigosa para o vialismo, e como punição, isolaram você no complexo prisional de Dema, o objetivo deles não é acabar com você diretamente, mas deixar que a exaustão mental e a tristeza te corroam até que você mesmo aceite a derrota que eles pregam.'
        botoes.innerHTML = '<button onclick="cenaIntro3()">Continuar</button>'
    }

    function cenaIntro3() {
        imagemFundo.src = '../assets/Quarto.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'Encolhido no chão de concreto, o frio da cela parece ecoar a apatia que há tanto tempo domina a sua mente, os cânticos distantes da Assembleia tentam te hipnotizar, puxando seus pensamentos para baixo, mas você resiste.'
        botoes.innerHTML = '<button onclick="cenaIntro4()">Continuar</button>'
    }

    function cenaIntro4() {
        imagemFundo.src = '../assets/Quarto.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'De repente, você sente um leve incômodo por dentro do tecido do seu casaco, uma textura áspera roça contra o seu peito a cada respiração, há algo escondido no forro do seu casaco cinza, algo que não pertence ao seu uniforme'
        botoes.innerHTML = '<button onclick="cenaIntro5()">Continuar</button>'
    }

    function cenaIntro5() {
        imagemFundo.src = '../assets/carta.png'
        nome.style.display = "none"
        texto.style.display = "none"
        botoes.innerHTML = '<button onclick="cenaIntro6()">Continuar</button>'
    }

    function cenaIntro6() {
        imagemFundo.src = '../assets/Quarto.png'
        nome.removeAttribute("style")
        texto.removeAttribute("style")
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'Você abre um pouco o casaco e toma um susto: no meio da escuridão daquela cela, fitas amarelas e vibrantes prendem um pedaço de papel desgastado ao forro da sua roupa, alguém conseguiu se infiltrar, passar pelos guardas e colar isso em você sem que percebessem.'
        botoes.innerHTML = '<button onclick="cenaIntro7()">Continuar</button>'
    }

    function cenaIntro7() {
        imagemFundo.src = '../assets/Quarto.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'As palavras no papel são de um tal de Torchbearer, ele te lembrou que Dema não é o seu lar, mas sim uma prisão, o ciclo pode ser quebrado, uma clareza repentina toma conta de você: é hora de acordar desse pesadelo, <b>você precisa fugir.</b>'
        botoes.innerHTML = '<button onclick="cenaIntro8()">Continuar</button>'
    }

    function cenaIntro8() {
        imagemFundo.src = '../assets/Quarto.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'Mas antes que possa absorver a gravidade da situação, o silêncio do corredor é quebrado, você ouve o som inconfundível de um guarda se aproximando, está vindo em direção à sua cela, faltam poucos segundos para abrirem a tranca e te verem ali, desperto e com a prova da rebelião nas mãos, <b>o que você faz?</b>'
        botoes.innerHTML =
            '<button onclick="guardaA(); salvar(1, \'A\', \'Cauteloso\', sessionStorage.getItem(\'ID_USUARIO\'))">A) Esconder a carta</button>' +
            '<button onclick="guardaB(); salvar(1, \'B\', \'Determinado\', sessionStorage.getItem(\'ID_USUARIO\'))">B) Se impor ao guarda</button>' +
            '<button onclick="guardaC(); salvar(1, \'C\', \'Estrategista\', sessionStorage.getItem(\'ID_USUARIO\'))">C) Destruir a carta</button>'
    }

    function guardaA() {
        etapaEscolha = 2;
        imagemFundo.src = '../assets/guarda.png'
        nome.innerHTML = 'GUARDA'
        texto.innerHTML = '"O sacrifício da sua felicidade é a única rota para você sair daqui, continue assim..." ele dá um sorriso de desprezo e tranca a porta novamente.'
        botoes.innerHTML = '<button onclick="cenaTijolo()">Continuar</button>'
    }

    function guardaB() {
        etapaEscolha = 2;
        imagemFundo.src = '../assets/guarda.png'
        nome.innerHTML = 'GUARDA'
        texto.innerHTML = '"Quem você pensa que é? Para de dar trabalho!" ele te empurra com força contra a parede, realiza uma revista e sai, trancando a porta.'
        botoes.innerHTML = '<button onclick="cenaTijolo()">Continuar</button>'
    }

    function guardaC() {
        etapaEscolha = 2;
        imagemFundo.src = '../assets/Quarto.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'A luz da lanterna passa pela fresta, o guarda te vê sentado, de mãos vazias e em silêncio, satisfeito, ele continua a patrulha pelo corredor.'
        botoes.innerHTML = '<button onclick="cenaTijolo()">Continuar</button>'
    }

    function cenaTijolo() {
        imagemFundo.src = '../assets/tijolo.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'Com o corredor novamente em silêncio, você examina a cela com um novo olhar, perto do ralo escuro, um tijolo marcado com uma tinta amarela cede ao seu toque.'
        botoes.innerHTML = '<button onclick="cenaChave()">Continuar</button>'
    }

    function cenaChave() {
        imagemFundo.src = '../assets/itens.png'
        nome.innerHTML = 'VOCÊ'
        texto.innerHTML = '"Uma bússola e uma cópia da chave mestra..." a oportunidade de quebrar o ciclo finalmente está nas suas mãos.'
        botoes.innerHTML = '<button onclick="cenaChave2()">Continuar</button>'
    }

    function cenaChave2() {
        imagemFundo.src = '../assets/porta.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = ' Você vai até a porta sem perder mais tempo e deposita a chave, a fechadura gira com um clique abafado, você empurra a porta de metal e dá o primeiro passo para fora da sua prisão.'
        botoes.innerHTML = '<button onclick="cenaTorre()">Continuar</button>'
    }

    function cenaTorre() {
        imagemFundo.src = '../assets/torre.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'Você esta fora da sua cela, porém ainda na prisão de Dema, o corredor central é iluminado por luzes brancas, de repente, passos metálicos ecoam subindo as escadas.'
        botoes.innerHTML =
            '<button onclick="torreA(); salvar(2, \'A\', \'Cauteloso\', sessionStorage.getItem(\'ID_USUARIO\'))">A) Se esconder</button>' +
            '<button onclick="torreB(); salvar(2, \'B\', \'Determinado\', sessionStorage.getItem(\'ID_USUARIO\'))">B) Descer as escadas</button>' +
            '<button onclick="torreC(); salvar(2, \'C\', \'Estrategista\', sessionStorage.getItem(\'ID_USUARIO\'))">C) Armar uma emboscada</button>'
    }

    function torreA() {
        etapaEscolha = 3;
        imagemFundo.src = '../assets/escada1.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'Você procura uma saída, um esconderijo, mas o único lugar que você poderia pasar despercebido é atrás de uma pilastra, a lanterna dele passa a centímetros do seu pé, você poderia ter enfrentado e não se escondido do problema, mas consegue descer a torre sem ser visto.'
        botoes.innerHTML = '<button onclick="cenaPatio()">Continuar</button>'
    }

    function torreB() {
        etapaEscolha = 3;
        imagemFundo.src = '../assets/escada1.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'Você desce a escada de metal, sem se importar com descrição, você já se cansou disso, você não aguenta mais, e precisa fugir o mais rápido possível. Você desce para o térreo, saindo do complexo prisional.'
        botoes.innerHTML = '<button onclick="cenaPatio()">Continuar</button>'
    }

    function torreC() {
        etapaEscolha = 3;
        imagemFundo.src = '../assets/escada1.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'Você se esconde atrás de uma pilastra com bastante paciência, espera o guarda passar e quando ele passa, você o empurra e ele cai atordoado, a esse ponto você não se importa mais com as consequências, você só quer se ver livre daquele lugar, você foge até o térreo.'
        botoes.innerHTML = '<button onclick="cenaPatio()">Continuar</button>'
    }

    function cenaPatio() {
        imagemFundo.src = '../assets/patio.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'Você empurra a porta e sai no pátio dos Falsos Ídolos, você se esconde em um beco próximo ao centro do pátio que continha uma estátua em posição de Seizing, você se lembra disso das aulas doutrinárias do  Vialismo, é uma técnica que permite que após uma pessoa falecer, os bispos tenham como controlar seus corpos usando um NED, um dispositivo de expansão neural, chifres presentes na cabeça de uma criatura também nomeada como NED, que após o crescimento total de suas galhadas, os bispos podem utilizar para seus feitos questionáveis...'
        botoes.innerHTML = '<button onclick="cenaPatio2()">Continuar</button>'
    }

    function cenaPatio2() {
        imagemFundo.src = '../assets/patio.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'Agora recém foragido da prisão, você precisa encontrar o amarelo, a ajuda que os Banditos te prometeram, eles deixaram claro que estariam te ajudando o tempo todo, mas que a real fuga seria apenas por sua conta.'
        botoes.innerHTML = '<button onclick="cenaPatio3()">Continuar</button>'
    }

    function cenaPatio3() {
        imagemFundo.src = '../assets/patio.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'Você se lembra do presente que havia recebido deles na sua cela, e retira a bussóla do bolso, uma bussóla velha porém funcional. "Procure pelo amarelo" ressoa em sua mente. você nota que sua bussóla tinha a direção norte pintada de amarelo, que por sua vez aponta para uma árvore ao Leste, do outro lado do pátio. <b>o que você faz?</b>'
        botoes.innerHTML =
            '<button onclick="patioA(); salvar(3, \'A\', \'Cauteloso\', sessionStorage.getItem(\'ID_USUARIO\'))">A) Pegar o caminho mais seguro até a coordenada.</button>' +
            '<button onclick="patioB(); salvar(3, \'B\', \'Determinado\', sessionStorage.getItem(\'ID_USUARIO\'))">B) Pegar o caminho mais rápido até o norte.</button>' +
            '<button onclick="patioC(); salvar(3, \'C\', \'Estrategista\', sessionStorage.getItem(\'ID_USUARIO\'))">C) Pegar o caminho por dentro dos prédios vazios da cidade.</button>'
    }

    function patioA() {
        etapaEscolha = 4;
        imagemFundo.src = '../assets/patio.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'Você contorna totalmente a cidade, procurando um caminho onde os olhos dos bispos não estariam em você, mas percebe que isso toma muito o seu tempo, você sente que teria sido melhor ter ido sido mais assertivo em seu caminho, mas seu medo te fez tomar a decisão que lhe parecia mais correta... Você chega ao norte.'
        botoes.innerHTML = '<button onclick="cenaPredio()">Continuar</button>'
    }

    function patioB() {
        etapaEscolha = 4;
        imagemFundo.src = '../assets/patio.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'Você ignora o fato de estarem te procurando, e que possivelmente te encontrariam na sua fuga, porém você não se importa, segue sua bússola meticulosamente, até o norte.'
        botoes.innerHTML = '<button onclick="cenaPredio()">Continuar</button>'
    }

    function patioC() {
        etapaEscolha = 4;
        imagemFundo.src = '../assets/patio.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'Você planeja um caminho para fugir com cautela, sem ser visto, por dentro dos prédios vazios do centro de Dema você, passo por passo, construiu sua fuga até o norte'
        botoes.innerHTML = '<button onclick="cenaPredio()">Continuar</button>'
    }

    function cenaPredio() {
        imagemFundo.src = '../assets/predio.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'Você encontra um prédio em ruínas, que se diferenciava de todos que você tinha passado em seu caminho escolhido, ele continha uma fita amarela cruzada em x, a cor que os bispos não enxergam. '
        botoes.innerHTML = '<button onclick="cenaInteriorPredio()">Continuar</button>'
    }

    function cenaInteriorPredio() {
        imagemFundo.src = '../assets/interiorPredio.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'Você entra no prédio, um lugar totalmente esquecido pela cidade, com móveis velhos que se deterioraram com o tempo, parecia a casa de alguém, porém de antes do vialismo se instalar em Dema, pois ali parecia ter algo que os complexos residenciais que os habitantes vivem não possuíam, felicidade, cor.'
        botoes.innerHTML = '<button onclick="cenaItem()">Continuar</button>'
    }

    function cenaItem() {
        imagemFundo.src = '../assets/interiorPredio.png'

        botoes.innerHTML = '<button onclick="cenaItemA()">Continuar</button>'
    }

    function cenaItemA() {
        imagemFundo.src = '../assets/interiorPredio.png'
        nome.innerHTML = 'NARRADOR'

    function cenaItemA2() {

        nome.style.display = "none"

        botoes.innerHTML = '<button onclick="cenaItemA3()">Continuar</button>'

    function cenaItemA3() {
        imagemFundo.src = '../assets/itemAAberto.png'
        nome.style.display = "none"
        texto.style.display = "none"
        botoes.innerHTML = '<button onclick="cenaItemA4()">Continuar</button>'
    }

    function cenaItemA4() {

        nome.innerHTML = 'NARRADOR'

        botoes.innerHTML = '<button onclick="cenaItemB()">Procurar debaixo da cama</button>'
    }

    function cenaItemB() {
        imagemFundo.src = '../assets/NED.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'Você se ajoelha e tateia a escuridão espessa debaixo da cama deteriorada, seus dedos tocam algo áspero, pesado, ao puxar o objeto para a pouca luz que entra no prédio, você prende a respiração: é um par de galhadas brancas e pontiagudas, as galhas de um NED, elas parecem pulsar com um calor fraco e reconfortante nas suas mãos, é uma relíquia sagrada para os banditos, uma prova física, rara e inegável, de que o poder de criação e a verdadeira vida existem muito além do controle de Nico.'
        botoes.innerHTML = '<button onclick="cenaItemC()">Procurar nas paredes</button>'

    function cenaItemC() {

        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'Você examina as paredes descascadas do quarto, batendo levemente na estrutura até escutar um som oco atrás de um painel de madeira apodrecido, quebrando a placa, você retira de dentro da parede um pergaminho enrolado, é um mapa desenhado à mão por antigos moradores, ele detalha todo o além Dema e Trench, destaca uma ilha chamada "Voldsoy", se as coisas ficarem difíceis, você pode fugir para lá.'
        botoes.innerHTML = '<button onclick="cenaItemC2()">Continuar</button>'
    }


    function cenaItemC2() {

        botoes.innerHTML = '<button onclick="cenaEscotilha()">Descer pela escotilha</button>'
    }

    function cenaEscotilha() {

    function cenaTrincheira() {
        imagemFundo.src = '../assets/keons.png'
        nome.innerHTML = 'NARRADOR'

        botoes.innerHTML = '<button onclick="cenaNicoAparece()">Continuar</button>'
    }

    function cenaNicoAparece() {
        imagemFundo.src = '../assets/nico.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'Uma figura imponente aparece bloqueando a única saída, é Nico, você o conhecia bem, a presença dele desencadeia um frio súbito no seu estômago, um aperto no peito e a falta de ar sufocante de um ataque de pânico, o silêncio dele já é ensurdecedor.'
        botoes.innerHTML = '<button onclick="cenaDialogoNico1()">Continuar</button>'
    }

    function cenaDialogoNico1() {
        imagemFundo.src = '../assets/nico.png'
        nome.innerHTML = 'NICO'
        texto.innerHTML = '"A esperança é uma doença exaustiva, não é? Olhe para Keons, ele se rebelou contra nós, Bispos, aceitando ser espião para os Banditos para te ajudar a escapar, fez você acreditar que havia um propósito além desta dor," a voz de Nico raspa diretamente dentro da sua mente, perfeitamente sintonizada com suas piores inseguranças. "Eu fui quem escreveu seu arquivo, eu sei o quão quebrado você está por dentro, toda essa sua rebelião é apenas uma máscara para o fato de que você é um fracasso"'
        botoes.innerHTML = '<button onclick="cenaDialogoNico2()">Continuar</button>'
    }

    function cenaDialogoNico2() {
        imagemFundo.src = '../assets/nico.png'
        nome.innerHTML = 'NICO'
        texto.innerHTML = '"Dema perdeu um pilar, mas o vazio sempre implora para ser preenchido, você tem a fraqueza exata que eu preciso, pare de lutar contra a maré, volte para o cinza, deixe-me anestesiar essa ansiedade que corrói seu peito, entregue-se, e eu prometo que você nunca mais terá que sentir nada."'
        botoes.innerHTML = '<button onclick="cenaDecisaoFinal()">Continuar</button>'
    }

    function cenaDecisaoFinal() {
        imagemFundo.src = '../assets/nico.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'A vontade de chorar trava sua garganta, sua insegurança tenta te convencer de que ele tem razão, que o cansaço é grande demais para continuar lutando. <b>O que você faz para resolver essa situação de uma vez por todas?</b>'
        botoes.innerHTML =
            '<button onclick="finalRuimInicio(); salvar(4, \'A\', \'Cauteloso\', sessionStorage.getItem(\'ID_USUARIO\'))">A) Entregar-se à apatia de Dema.</button>' +
            '<button onclick="finalBomInicio(); salvar(4, \'B\', \'Estrategista\', sessionStorage.getItem(\'ID_USUARIO\'))">B) Fugir às cegas pelo túnel.</button>' +

        imagemFundo.src = '../assets/nico.png'
        nome.innerHTML = 'NARRADOR'
        texto.innerHTML = 'Você solta um suspiro trêmulo e abaixa os braços, a resistência desmorona, as lágrimas de frustração secam, substituídas por uma dormência assustadora, você aceita as palavras venenosas de Nico como a sua única verdade, suas pernas cedem, e você cai de joelhos ao lado do corpo de Keons, permitindo que a frieza do chão absorva a última gota de cor e calor do seu corpo.'
        botoes.innerHTML = '<button onclick="finalRuimConclusao()">Continuar</button>'
    }

    function finalRuimConclusao() {

    function salvar(numeroPergunta, questao, tipoPergunta, idUsuario) {

        let numPergunta = numeroPergunta
        let letraQuestao = questao
        let tipo = tipoPergunta
        let usuario = idUsuario

        fetch("/questionario/salvarQuestao", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                numeroPergunta: numPergunta,
                questao: letraQuestao,
                tipoPergunta: tipo,
                idUsuario: usuario
            })
        })
            .then(function (resposta) {
                if (resposta.ok) {
                    return resposta.json()
                } else {
                    throw "Erro ao salvar questão!"
                }
            })
            .then(function (dados) {
                console.log("Questão salva com sucesso:", dados)
            })
            .catch(function (erro) {
                console.log(erro)
            })

    }

    function aoClicarPlay() {
        fetch("/questionario/deletarQuestoes", {
            method: "DELETE",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                idUsuario: usuario
            })
        })
            .then(function (resposta) {
                return resposta.json()
            })
            .then(function (dados) {
                console.log(dados.mensagem)

            })
            .catch(function (erro) {
                console.log("Erro ao deletar questões:", erro)
            });
    }
